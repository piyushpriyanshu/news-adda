name: Collect news

# The backend scheduler when no server is self-hosted: every run polls the
# sources that are due, updates the story database and publishes feed.json to
# the `data` branch, which the app reads. GitHub may delay scheduled runs under
# load, so expect a new feed roughly every 5-15 minutes.

on:
  schedule:
    - cron: "2-59/5 * * * *"   # every 5 min, off the busy top-of-hour slot
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/newsadda/**", ".github/workflows/collect.yml"]

permissions:
  contents: write

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Restore previous state
        run: |
          mkdir -p state out
          if git fetch -q --depth 1 origin data; then
            if git show FETCH_HEAD:state.db.gz > state/newsadda.db.gz 2>/dev/null; then
              gunzip -f state/newsadda.db.gz && echo "state restored ($(du -h state/newsadda.db | cut -f1))"
            fi
          else
            echo "no data branch yet; starting fresh"
          fi

      - name: Collect and export
        working-directory: backend
        env:
          NEWSADDA_DB: ../state/newsadda.db
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSADDA_AI_SUMMARY: ${{ vars.NEWSADDA_AI_SUMMARY || '0' }}
        run: python -m newsadda run --export ../out

      - name: Publish to data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect("state/newsadda.db")
          c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          c.execute("PRAGMA journal_mode=DELETE")
          c.close()
          PY
          gzip -c state/newsadda.db > out/state.db.gz
          cat > out/README.md <<'MD'
          # News Adda data (auto-generated)
          Written by the "Collect news" workflow. `feed.json` is what the app reads;
          `health.json` is per-source status; `state.db.gz` carries state between runs.
          Do not edit by hand.
          MD
          .github/scripts/publish_branch.sh data out "feed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
