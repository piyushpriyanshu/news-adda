name: Android emulator smoke test

# Runs the release build (minified, signed) on an Android emulator against the live feed: opens
# every section, a story, search, background/foreground and offline mode,
# and fails on any crash. Screenshots go to the ci-android-smoke branch.

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-smoke.yml", ".github/scripts/android_smoke.sh"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK (what users install)
        working-directory: android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0" > /dev/null
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android_smoke.sh
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p smoke
          echo "commit=${GITHUB_SHA} at=$(date -u +%FT%TZ)" >> smoke/result.txt
          .github/scripts/publish_branch.sh ci-android-smoke smoke "smoke ${GITHUB_SHA::7}"
      - name: Fail on crash
        if: always()
        run: "! grep -q 'crash=yes' smoke/result.txt"
