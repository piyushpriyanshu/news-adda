  # ---- Google News RSS searches (publisher links arrive via Google News) ----
  # Used for publishers without a reachable public feed and as an early-
  # detection net. Titles keep the original publisher's name.

  - id: gn_bhaskar
    name: Dainik Bhaskar (via Google News)
    name_hi: दैनिक भास्कर (गूगल न्यूज़ से)
    kind: google_news
    query: "site:bhaskar.com उत्तर प्रदेश when:1d"
    min_interval: 600

  - id: gn_uptak
    name: UP Tak (via Google News)
    name_hi: यूपी तक (गूगल न्यूज़ से)
    kind: google_news
    query: "site:uptak.in when:1d"
    min_interval: 600

  - id: gn_lallantop
    name: The Lallantop (via Google News)
    name_hi: द लल्लनटॉप (गूगल न्यूज़ से)
    kind: google_news
    query: "site:thelallantop.com उत्तर प्रदेश OR यूपी when:2d"
    up_section: false
    min_interval: 900

  - id: gn_up_politics
    name: Google News — UP politics
    name_hi: गूगल न्यूज़ — यूपी राजनीति
    kind: google_news
    query: "(यूपी OR \"उत्तर प्रदेश\") (भाजपा OR सपा OR बसपा OR कांग्रेस OR विधायक OR सांसद) when:1d"
    min_interval: 600

  - id: gn_up_leaders
    name: Google News — UP leaders
    name_hi: गूगल न्यूज़ — यूपी नेता
    kind: google_news
    query: "\"योगी आदित्यनाथ\" OR \"अखिलेश यादव\" OR मायावती OR \"केशव प्रसाद मौर्य\" OR \"ब्रजेश पाठक\" OR राजभर when:1d"
    min_interval: 600

  - id: gn_up_leaders_2
    name: Google News — UP leaders (allies, opposition)
    name_hi: गूगल न्यूज़ — यूपी नेता (सहयोगी, विपक्ष)
    kind: google_news
    query: "\"डिंपल यादव\" OR शिवपाल OR \"जयंत चौधरी\" OR \"संजय निषाद\" OR \"अनुप्रिया पटेल\" OR \"चंद्रशेखर आजाद\" when:1d"
    min_interval: 900

  - id: gn_up_election
    name: Google News — UP elections
    name_hi: गूगल न्यूज़ — यूपी चुनाव
    kind: google_news
    query: "(यूपी OR \"उत्तर प्रदेश\") (उपचुनाव OR टिकट OR \"चुनाव आयोग\" OR प्रत्याशी) when:1d"
    min_interval: 900

  # ---- Public statements on X ----
  # Needs X_BEARER_TOKEN (official X API v2, recent search). Without it the
  # source shows as "unavailable" and everything else keeps working.
  # Handles are resolved through the API itself; display names shown in the
  # app come from X, not from this file. Verify handles before relying on them.
  - id: x_leaders
    name: X — UP leaders
    name_hi: एक्स — यूपी नेता
    kind: x
    up_section: true
    min_interval: 900
    handles:
