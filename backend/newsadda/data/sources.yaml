# News Adda source registry.
#
# Each source is polled by the backend only, never by the phone.
#
#   id            stable identifier (never reuse an id for a different publisher)
#   name / name_hi   display names
#   kind          rss | google_news | x
#   urls          feed URLs in order of preference; the first one that returns a
#                 valid feed is used and remembered. Later entries are fallbacks.
#   listing_pages publisher pages (RSS index or section page) that the
#                 `discover` command scans for feed links. Not polled routinely.
#   query         (google_news) search query; built into a Google News RSS URL
#   up_section    true when the feed is already a UP section, so every item is
#                 kept; false means items must mention UP to be kept
#   min_interval  minimum seconds between polls of this source (politeness)
#   enabled       set false to switch a source off without deleting it
#   status_note   honest note shown in the app's source list
#
# Run `python -m newsadda discover` (or the backend CI workflow) to re-check
# every URL against the live sites. Source status in the app always comes from
# the latest real fetch, never from this file.

defaults:
  min_interval: 240
  up_section: true
  enabled: true

sources:
