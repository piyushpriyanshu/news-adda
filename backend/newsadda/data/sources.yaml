# News Adda source registry.
#
# Each source is polled by the backend only, never by the phone.
#
#   id            stable identifier; the part before "_" names the publisher, so
#                 amarujala_up and amarujala_lucknow count as ONE publisher
#   name / name_hi   display names
#   aliases       other names the publisher appears under (Google News etc.)
#   kind          rss | google_news | x
#   urls          feed URLs in order of preference; the first that returns a
#                 valid feed is used and remembered, later ones are fallbacks
#   listing_pages publisher pages scanned by `python -m newsadda discover`
#   query         (google_news) search query, built into a Google News RSS URL
#   up_section    true = feed is already UP-only; false = items must mention UP
#   min_interval  minimum seconds between polls of this source (politeness)
#   enabled       false switches a source off without deleting it
#   status_note   honest note shown in the app's source list
#   site          publisher website for its icon (default: derived from the feed URL)
#   live_wire     the phone also polls this feed itself for the fastest headlines
#
# Live check: the "Backend tests and source check" workflow tests every URL
# daily and publishes discovery.txt / discovery.json to the ci-backend branch.
# Status in the app always comes from the latest real fetch, not this file.
#
# Verified 2026-10-13 from GitHub Actions:
#   working direct feeds: Amar Ujala (UP, Lucknow), ABP (UP), TV9 (UP), News18 (UP)
#   no reachable public feed: Dainik Jagran (404), Navbharat Times (404),
#     Aaj Tak (404), Zee News (404), Jansatta (403), Live Hindustan UP (empty
#     feed / 503), Dainik Bhaskar, UP Tak, Lallantop, Patrika, ETV Bharat
#   -> those publishers are covered through Google News RSS searches below.

defaults:
  min_interval: 240
  up_section: true
  enabled: true

# Credibility: items that reach us through Google News are kept only when the
# original publisher is an established outlet or news agency. Outlets we follow
# directly (above/below) are trusted automatically. Names are matched loosely
# (case, spaces and punctuation ignored). Anything else is dropped.
trusted_publishers: [
  # Hindi dailies and portals
  Amar Ujala, Dainik Bhaskar, Dainik Jagran, Jagran, Hindustan, Live Hindustan, Navbharat Times, Jansatta,
  Patrika, Rajasthan Patrika, Prabhat Khabar, Punjab Kesari, Nai Dunia, Naidunia, Haribhoomi, Dainik Tribune,
  Amar Ujala Lucknow, inextlive, Inext Live, Swatantra Bharat,
  # TV news (Hindi)
  Aaj Tak, AajTak, ABP News, ABP Live, ABP Ganga, News18 Hindi, News18, News18 UP Uttarakhand, TV9 Hindi,
  TV9 Bharatvarsh, Zee News, Zee News Hindi, Zee Uttar Pradesh Uttarakhand, India TV, India TV Hindi,
  NDTV India, NDTV, Times Now Navbharat, Republic Bharat, News24, News 24, News Nation, Bharat Samachar,
  DD News, DD News Hindi, Sansad TV,
  # Digital and UP-focused
  UP Tak, UPTak, The Lallantop, Lallantop, ETV Bharat, ETV Bharat Uttar Pradesh, The Print Hindi, ThePrint Hindi,
  BBC Hindi, BBC News Hindi, Satya Hindi, The Wire Hindi, Navjivan, Asianet News Hindi, Oneindia Hindi,
  Webdunia, Prabhasakshi, Hindustan Times Hindi, Jagran Josh,
  # Agencies
  PTI, PTI Bhasha, IANS, IANS Hindi, ANI, UNI, Univarta, Hindusthan Samachar, हिन्दुस्थान समाचार, Hindustan Samachar,
  # Hindi names as Google News shows them
  अमर उजाला, दैनिक भास्कर, दैनिक जागरण, हिन्दुस्तान, नवभारत टाइम्स, आज तक, न्यूज़18 हिंदी, एबीपी न्यूज़,
  ज़ी न्यूज़, इंडिया टीवी, जनसत्ता, पत्रिका, टीवी9 भारतवर्ष, एनडीटीवी इंडिया, यूपी तक, बीबीसी हिंदी, पंजाब केसरी,
]

# Google News sometimes returns social posts or re-aggregators; skip them.
blocked_publishers: [Facebook, YouTube, Instagram, X, Twitter, Head Topics, Dailyhunt]

