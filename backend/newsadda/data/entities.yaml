# Entities News Adda recognises in headlines and summaries.
# Edit freely: the backend reloads this file on every run and ships the lists
# to the app inside feed.json, so the app picks up changes without an update.
#
# Matching is on whole words after normalisation (nukta and chandrabindu are
# folded, so "आज़ाद"/"आजाद" and "बाँदा"/"बांदा" match the same alias).
# Prefer full names over surnames that many people share.

